<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokédex</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/home.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a href="index.html"><h1>Pokédex</h1></a>
      </div>
    </header>

    <main class="container">
      <div class="toolbar">
        <input type="search" id="search-input" placeholder="Buscar Pokémon..." />
        <select id="type-filter" aria-label="Filtrar por tipo">
          <option value="">Todos los tipos</option>
        </select>
      </div>

      <p id="state-message" class="state-message hidden"></p>

      <ul id="pokemon-grid" class="pokemon-grid"></ul>

      <div class="pagination">
        <button type="button" id="prev-page" class="btn" disabled>Anterior</button>
        <button type="button" id="next-page" class="btn">Siguiente</button>
      </div>
    </main>

    <script type="module" src="js/home.js"></script>
  </body>
</html>
