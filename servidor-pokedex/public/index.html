<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokédex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/home.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a href="index.html">
          <h1><span class="pokeball" aria-hidden="true"></span>Pokédex</h1>
        </a>
      </div>
    </header>

    <main class="container">
      <div class="toolbar">
        <select id="search-mode" aria-label="Tipo de búsqueda">
          <option value="nombre">Buscar por: Nombre</option>
          <option value="tipo">Buscar por: Tipo</option>
        </select>
        <input type="search" id="search-input" placeholder="Buscar Pokémon..." />
      </div>

      <p id="state-message" class="state-message hidden"></p>

      <ul id="pokemon-grid" class="pokemon-grid"></ul>

      <div class="pagination">
        <button type="button" id="prev-page" class="btn" disabled>Anterior</button>
        <button type="button" id="next-page" class="btn">Siguiente</button>
      </div>
    </main>

    <script type="module" src="js/home.js"></script>
  </body>
</html>
