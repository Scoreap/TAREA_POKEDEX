<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokédex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/home.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a href="index.html" class="brand">
          <span class="pokeball" aria-hidden="true"></span>
          <h1 class="brand-logo">
            <span class="brand-logo__title">Pokédex</span>
            <span class="brand-logo__subtitle">Grupo 6</span>
          </h1>
        </a>
      </div>
    </header>

    <main class="container">
      <div class="toolbar">
        <input type="search" id="search-input" placeholder="Buscar Pokémon..." />
        <select id="generation-filter" aria-label="Filtrar por generación">
          <option value="">Todas las generaciones</option>
        </select>
        <select id="type1-filter" aria-label="Filtrar por tipo primario">
          <option value="">Tipo 1: cualquiera</option>
        </select>
        <select id="type2-filter" aria-label="Filtrar por tipo secundario">
          <option value="">Tipo 2: cualquiera</option>
        </select>
      </div>

      <p id="state-message" class="state-message hidden"></p>

      <ul id="pokemon-grid" class="pokemon-grid"></ul>

      <div class="pagination">
        <button type="button" id="prev-page" class="btn" disabled>Anterior</button>
        <button type="button" id="next-page" class="btn">Siguiente</button>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p class="site-footer__title">Grupo 6 - Programación Web</p>
        <ul class="team-list">
          <li>Sophia Corea</li>
          <li>Cristopher López</li>
          <li>Jose Rodrigo Herrera</li>
          <li>Michael Gutiérrez</li>
          <li>Josué Reyes</li>
        </ul>
      </div>
    </footer>

    <script type="module" src="js/home.js"></script>
  </body>
</html>
